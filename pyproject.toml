[project]
name = "ai-influencer-factory"
version = "0.1.0"
description = "Production system for hyperrealistic, consistent AI influencers"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Only needed once Phase 5 (Consistency Test) actually scores real faces —
# not part of the core install so the rest of the engine stays lightweight
# on the Mac. See engine/identity/consistency_score.py.
identity = [
    "insightface>=0.7",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
]
# Only needed to actually run scripts/generate_candidates.py (Phase 2) — see
# docs/PHASE2_RUNBOOK.md. Not part of the core install.
generation = [
    "fal-client>=0.4",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]
